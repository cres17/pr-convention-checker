# .drift-gate.yml — Spec/Contract Drift Gate 정책 파일
#
# PR 변경분과 팀 계약 문서의 정합성을 판정하는 규칙을 정의합니다.
# 각 rule은 'when' 조건이 충족될 때 활성화되고,
# 'require.groups'의 모든 묶음을 만족해야 통과합니다.

rules:
  # ──────────────────────────────────────────────────────────
  # API surface 변경 → 계약 문서 + 릴리즈 공지 동기화
  # ──────────────────────────────────────────────────────────
  - id: api-contract-sync
    when:
      any_changed:
        - "src/routes/**"
        - "openapi/**"
        - "proto/**"
        - "src/controllers/**"
        - "app/controllers/**"
    require:
      groups:
        - name: "API 계약 문서"
          any_changed:
            - "docs/spec.md"
            - "docs/api/**"
            - "openapi/**"
        - name: "릴리즈 공지"
          all_changed:
            - "CHANGELOG.md"
    severity: blocker
    message: "API surface changed without synced contract/docs"

  # ──────────────────────────────────────────────────────────
  # DB 스키마 변경 → 운영 문서 + 검증 흔적
  # ──────────────────────────────────────────────────────────
  - id: schema-migration-proof
    when:
      any_changed:
        - "db/migrations/**"
        - "prisma/schema.prisma"
        - "sql/**"
        - "**/schema.sql"
        - "database/migrations/**"
        - "alembic/versions/**"
    require:
      groups:
        - name: "운영 문서"
          any_changed:
            - "docs/runbook/**"
            - "docs/migration-notes/**"
        - name: "검증 흔적"
          any_changed:
            - "tests/integration/**"
            - "tests/e2e/**"
    severity: major
    message: "DB schema changed without migration note/runbook or verification test"

  # ──────────────────────────────────────────────────────────
  # env/config 변경 → .env.example + 배포 문서
  # ──────────────────────────────────────────────────────────
  - id: env-config-sync
    when:
      any_changed:
        - ".env"
        - ".env.local"
        - ".env.production"
        - ".env.staging"
        - "config/**"
        - "src/config/**"
        - "**/settings.py"
    require:
      groups:
        - name: "샘플 환경변수"
          all_changed:
            - ".env.example"
        - name: "배포 문서"
          any_changed:
            - "docs/deployment/**"
            - "docs/runbook/**"
    severity: major
    message: "env/config changed without .env.example or deployment docs update"

  # ──────────────────────────────────────────────────────────
  # CI/인프라 변경 → 운영 문서
  # ──────────────────────────────────────────────────────────
  - id: workflow-ops-doc
    when:
      any_changed:
        - ".github/workflows/**"
        - "infra/**"
        - "terraform/**"
        - "Dockerfile"
        - "Dockerfile.*"
        - "k8s/**"
        - "helm/**"
    require:
      groups:
        - name: "운영 문서"
          any_changed:
            - "docs/ops/**"
            - "docs/runbook/**"
    severity: minor
    message: "CI/infra changed without ops documentation update"

  # ──────────────────────────────────────────────────────────
  # auth/권한 변경 → 보안 문서
  # ──────────────────────────────────────────────────────────
  - id: auth-security-doc
    when:
      any_changed:
        - "**/auth/**"
        - "**/middleware/auth*"
        - "**/rbac/**"
        - "**/permissions/**"
        - "**/policy/**"
    require:
      groups:
        - name: "보안/권한 문서"
          any_changed:
            - "docs/security/**"
            - "docs/auth/**"
            - "docs/runbook/**"
    severity: major
    message: "Auth/permission changed without security documentation update"

# ──────────────────────────────────────────────────────────
# CI 게이트 기준
# ──────────────────────────────────────────────────────────
gate:
  fail_on_blocker: true      # BLOCKER 1개 이상 → CI 실패
  fail_on_major_count: 2     # MAJOR 2개 이상 → CI 실패
  # MINOR만 있으면 통과 (PR 코멘트만 게시)

# ──────────────────────────────────────────────────────────
# drift 평가 제외 경로
# ──────────────────────────────────────────────────────────
ignore_paths:
  - "src/internal/**"     # 내부 구현 전용
  - "scripts/dev/**"      # 개발 편의 스크립트
  - "**/*.test.*"         # 테스트 파일
  - "**/*.spec.*"
  - "docs/**"             # 문서 자체 변경은 제외
