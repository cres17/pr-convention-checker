name: Spec/Contract Drift Gate
description: "Checks if code changes are in sync with your team's contract docs (spec/runbook/CHANGELOG). Blocks merge when contract docs are missing."

branding:
  icon: shield
  color: purple

inputs:
  anthropic_api_key:
    description: Anthropic API key (required for Claude checklist generation)
    required: true
  github_token:
    description: GitHub token for posting PR comments
    required: true
    default: ${{ github.token }}
  policy_file:
    description: Path to drift gate policy file
    required: false
    default: ".drift-gate.yml"
  model:
    description: Claude model ID to use for checklist generation
    required: false
    default: "claude-opus-4-6"
  post_comment:
    description: Post result as PR comment (true/false)
    required: false
    default: "true"
  fail_on_blocker:
    description: Exit 1 when BLOCKER violations are found
    required: false
    default: "true"

outputs:
  result:
    description: Gate result (pass / warn / fail / skip)
    value: ${{ steps.check.outputs.result }}
  blocker_count:
    description: Number of BLOCKER violations
    value: ${{ steps.check.outputs.blocker_count }}
  major_count:
    description: Number of MAJOR violations
    value: ${{ steps.check.outputs.major_count }}
  violation_count:
    description: Total number of violations
    value: ${{ steps.check.outputs.violation_count }}
  comment_url:
    description: URL of the posted PR comment
    value: ${{ steps.post.outputs.comment_url }}

runs:
  using: composite
  steps:
    - name: Run drift gate evaluation
      id: check
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MODEL: ${{ inputs.model }}
        POLICY_FILE: ${{ inputs.policy_file }}
      run: ${{ github.action_path }}/github-action/entrypoint.sh

    - name: Post PR comment
      id: post
      if: inputs.post_comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_MARKER: "<!-- drift-gate-v1 -->"
      run: |
        REPORT_FILE="${RUNNER_TEMP}/drift_gate_report.md"
        if [ ! -f "$REPORT_FILE" ]; then
          echo "report file not found, skipping comment"
          exit 0
        fi

        BODY=$(cat "$REPORT_FILE")

        EXISTING_ID=$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.body | startswith(\"${COMMENT_MARKER}\")) | .id" \
          | head -1)

        if [ -n "$EXISTING_ID" ]; then
          COMMENT_URL=$(gh api \
            -X PATCH \
            "repos/${REPO}/issues/comments/${EXISTING_ID}" \
            -f body="$BODY" \
            --jq ".html_url")
        else
          COMMENT_URL=$(gh api \
            -X POST \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY" \
            --jq ".html_url")
        fi

        echo "comment_url=${COMMENT_URL}" >> "$GITHUB_OUTPUT"

    - name: Fail on blocker
      if: inputs.fail_on_blocker == 'true' && steps.check.outputs.result == 'fail'
      shell: bash
      run: |
        echo "::error::Drift Gate FAIL — ${{ steps.check.outputs.blocker_count }} BLOCKER(s) found. Sync your contract docs before merging."
        exit 1
