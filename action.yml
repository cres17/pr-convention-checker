name: Spec/Contract Drift Gate
description: "Checks if code changes are in sync with your team's contract docs (spec/runbook/CHANGELOG). Blocks merge when contract docs are missing."

branding:
  icon: shield
  color: purple

inputs:
  anthropic_api_key:
    description: Anthropic API key (optional — used for Claude checklist enrichment)
    required: false
    default: ""
  github_token:
    description: GitHub token for posting PR comments
    required: true
    default: ${{ github.token }}
  policy_file:
    description: Path to drift gate policy file
    required: false
    default: ".drift-gate.yml"
  model:
    description: Claude model ID for checklist enrichment
    required: false
    default: "claude-opus-4-6"
  post_comment:
    description: Post result as PR comment (true/false)
    required: false
    default: "true"
  fail_on_blocker:
    description: Exit 1 when the configured gate result is fail
    required: false
    default: "true"
  upload_report_artifact:
    description: Upload Markdown, JSON, and HTML reports as a workflow artifact
    required: false
    default: "true"

outputs:
  result:
    description: Gate result (pass / warn / fail / skip)
    value: ${{ steps.check.outputs.result }}
  blocker_count:
    description: Number of BLOCKER violations
    value: ${{ steps.check.outputs.blocker_count }}
  major_count:
    description: Number of MAJOR violations
    value: ${{ steps.check.outputs.major_count }}
  violation_count:
    description: Total number of violations
    value: ${{ steps.check.outputs.violation_count }}
  comment_url:
    description: URL of the posted PR comment
    value: ${{ steps.check.outputs.comment_url }}
  markdown_report_path:
    description: Path to the generated Markdown report
    value: ${{ steps.check.outputs.markdown_report_path }}
  json_report_path:
    description: Path to the generated JSON report
    value: ${{ steps.check.outputs.json_report_path }}
  html_report_path:
    description: Path to the generated HTML report
    value: ${{ steps.check.outputs.html_report_path }}
  history_path:
    description: Path to the generated history JSONL artifact
    value: ${{ steps.check.outputs.history_path }}
  artifact_name:
    description: Name of uploaded report artifact
    value: ${{ steps.check.outputs.artifact_name }}
  html_artifact_hint:
    description: Hint path to the HTML report inside the artifact
    value: ${{ steps.check.outputs.html_artifact_hint }}
  policy_error:
    description: Policy load or validation error, when evaluation cannot run
    value: ${{ steps.check.outputs.policy_error }}

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: pip install pyyaml --quiet

    - name: Run drift gate evaluation
      id: check
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        POLICY_FILE: ${{ inputs.policy_file }}
        MODEL: ${{ inputs.model }}
        POST_COMMENT: ${{ inputs.post_comment }}
      run: |
        cd "${{ github.action_path }}"
        python3 -m drift_gate.adapters.github_action.runner

    - name: Upload Drift Gate reports
      if: always() && inputs.upload_report_artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: drift-gate-report
        path: |
          ${{ steps.check.outputs.markdown_report_path }}
          ${{ steps.check.outputs.json_report_path }}
          ${{ steps.check.outputs.html_report_path }}
          ${{ steps.check.outputs.history_path }}

    - name: Fail on blocker
      if: inputs.fail_on_blocker == 'true' && steps.check.outputs.result == 'fail'
      shell: bash
      run: |
        echo "::error::Drift Gate FAIL - ${{ steps.check.outputs.blocker_count }} BLOCKER(s), ${{ steps.check.outputs.major_count }} MAJOR(s). Sync your contract docs before merging."
        exit 1
