name: CI

on:
  push:
    branches: [main, develop, ver2]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  self-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.11'
      - name: Install local checker
        run: pip install -e . zstandard==0.25.0
      - name: Restore grammar downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/driftgate-parser-cache
          key: grammars-${{ runner.os }}-${{ runner.arch }}-language-pack-1.20.0
      - name: Prepare checked grammars
        env:
          TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ runner.temp }}/driftgate-parser-cache
        run: python packaging/prepare_parsers.py
      - name: Check the actual change with repository policy
        env:
          SELF_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ runner.temp }}/driftgate-parser-cache
        run: python scripts/check_self.py --base "$SELF_CHECK_BASE" --trusted-policy-ref ae0028d5edd95d5dd4819939a5801cb028639a6b --out build/self-check.json
      - name: Check immutable objects with a pinned policy
        env:
          SELF_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ runner.temp }}/driftgate-parser-cache
        run: >
          python -m drift_gate check --base "$SELF_CHECK_BASE" --head "$GITHUB_SHA"
          --policy .drift-gate.self.yml
          --trusted-policy-ref ae0028d5edd95d5dd4819939a5801cb028639a6b
          --trusted-policy-sha256 3b703eaf71d1fbb7ab3a3eea1a704e99912c70344daa1c7a6da7c4ad1f5bf2eb
          --json --out-json build/object-self-check.json > build/object-self-check-stdout.json
      - name: Preserve policy coverage and gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-gate-self-check
          path: |
            build/self-check.json
            build/object-self-check.json

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,oracle]" zstandard==0.25.0

      - name: Restore grammar downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/driftgate-parser-cache
          key: grammars-${{ runner.os }}-${{ runner.arch }}-language-pack-1.20.0

      - name: Prepare grammars before semantic tests
        env:
          TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ runner.temp }}/driftgate-parser-cache
        run: python packaging/prepare_parsers.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install fixed Express HTTP oracle
        run: npm install --prefix "${{ runner.temp }}/express-oracle" --no-audit --no-fund express@4.21.2

      - name: Run pytest
        env:
          TREE_SITTER_LANGUAGE_PACK_CACHE_DIR: ${{ runner.temp }}/driftgate-parser-cache
          DRIFT_GATE_EXPRESS_ORACLE_DIR: ${{ runner.temp }}/express-oracle
        run: pytest drift_gate/tests/ -v --tb=short

      - name: Verify frozen semantic evaluation axes
        run: |
          python scripts/audit_auto_contracts.py --out build/auto-contracts-v2.json
          python scripts/audit_auto_contracts.py --suite drift_gate/tests/contracts/express-contracts-v1.json --out build/express-contracts-v1.json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff mypy

      - name: Lint Python errors and unused code with ruff
        run: ruff check drift_gate/ --select=E9,F

      - name: Type check with mypy (optional)
        run: mypy drift_gate/core --ignore-missing-imports || true

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" zstandard==0.25.0

      - name: Run deterministic benchmark
        run: |
          drift-gate-eval --recursive --compare-baseline \
            --max-fp 0 \
            --max-fn 0 \
            --min-f1 1.0 \
            --out benchmark.md \
            --html-out benchmark.html \
            --case-report-dir benchmark-reports

      - name: Run multi-engine benchmark
        run: |
          drift-gate-eval \
            --recursive \
            --engines path-only,patch-aware,semantic-aware \
            --out benchmark-engines.md \
            --html-out benchmark-engines.html \
            --case-report-dir benchmark-engine-reports

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drift-gate-benchmark
          path: |
            benchmark.md
            benchmark.html
            benchmark-reports/
            benchmark-engines.md
            benchmark-engines.html
            benchmark-engine-reports/
