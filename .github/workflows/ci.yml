name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest drift_gate/tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" ruff mypy

      - name: Lint critical Python errors with ruff
        run: ruff check drift_gate/ --select=E9,F63,F7,F82

      - name: Type check with mypy (optional)
        run: mypy drift_gate/core --ignore-missing-imports || true

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run deterministic benchmark
        run: |
          drift-gate-eval --compare-baseline \
            --max-fp 0 \
            --max-fn 0 \
            --min-f1 1.0 \
            --out benchmark.md \
            --html-out benchmark.html \
            --case-report-dir benchmark-reports

      - name: Run multi-engine benchmark
        run: |
          drift-gate-eval \
            --engines path-only,patch-aware,semantic-aware,llm-enriched \
            --out benchmark-engines.md \
            --html-out benchmark-engines.html \
            --case-report-dir benchmark-engine-reports

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drift-gate-benchmark
          path: |
            benchmark.md
            benchmark.html
            benchmark-reports/
            benchmark-engines.md
            benchmark-engines.html
            benchmark-engine-reports/
