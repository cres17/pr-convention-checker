name: Desktop app build

on:
  push:
    branches: [ver2]
    paths:
      - .github/workflows/desktop-build.yml
      - drift_gate/**
      - desktop-ui/**
      - pyproject.toml
  pull_request:
    branches: [ver2]
    paths:
      - .github/workflows/desktop-build.yml
      - drift_gate/**
      - desktop-ui/**
      - pyproject.toml
  workflow_dispatch:
  # Reused by desktop-release.yml so releases ship exactly what this job tested.
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Build and test React UI
        working-directory: desktop-ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Install app and build tools
        run: python -m pip install -e ".[dev,desktop]" pyinstaller
      - name: Check desktop behavior
        run: >
          python -m pytest -q
          drift_gate/tests/test_desktop_service.py
          drift_gate/tests/test_desktop_ui.py
          drift_gate/tests/test_desktop_web.py
          drift_gate/tests/test_subscription_review.py
          drift_gate/tests/test_progress_service.py
          drift_gate/tests/test_progress_history.py
          drift_gate/tests/test_progress_report.py
          drift_gate/tests/test_doc_links.py
          drift_gate/tests/test_verification_records.py
          drift_gate/tests/test_policy_setup.py
          drift_gate/tests/test_report_naming.py
      - name: Build native app
        run: pyinstaller --noconfirm --clean --windowed --onedir --name DriftGate --collect-all tree_sitter_language_pack --add-data "drift_gate/desktop/web:drift_gate/desktop/web" drift_gate/desktop/web_app.py
      - name: Verify the packaged app
        shell: python
        run: |
          import os, sys
          executable = "dist/DriftGate.app/Contents/MacOS/DriftGate" if sys.platform == "darwin" else "dist/DriftGate/DriftGate.exe"
          if not os.path.isfile(executable):
              sys.exit(f"missing packaged executable: {executable}")
          print("packaged:", executable, os.path.getsize(executable), "bytes")
          # The bundle layout differs between PyInstaller versions, so look for the UI anywhere in dist.
          bundled_ui = [
              os.path.join(root, name)
              for root, _, names in os.walk("dist")
              for name in names
              if name == "index.html" and root.replace(os.sep, "/").endswith("drift_gate/desktop/web")
          ]
          if not bundled_ui:
              sys.exit("the React UI (drift_gate/desktop/web/index.html) is not in the package")
          print("bundled UI:", bundled_ui[0])
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DriftGate.app DriftGate-macOS.zip
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DriftGate -DestinationPath DriftGate-Windows.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: DriftGate-macOS
          path: DriftGate-macOS.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: DriftGate-Windows
          path: DriftGate-Windows.zip
          retention-days: 14
