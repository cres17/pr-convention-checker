name: Desktop app build

on:
  push:
    branches: [ver2]
    paths:
      - .github/workflows/desktop-build.yml
      - drift_gate/**
      - desktop-ui/**
      - pyproject.toml
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop-ui/package-lock.json
      - name: Build and test React UI
        working-directory: desktop-ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Install app and build tools
        run: python -m pip install -e ".[dev,desktop]" pyinstaller
      - name: Check desktop behavior
        run: >
          python -m pytest -q
          drift_gate/tests/test_desktop_service.py
          drift_gate/tests/test_desktop_ui.py
          drift_gate/tests/test_desktop_web.py
          drift_gate/tests/test_subscription_review.py
          drift_gate/tests/test_progress_service.py
          drift_gate/tests/test_progress_history.py
          drift_gate/tests/test_progress_report.py
          drift_gate/tests/test_doc_links.py
          drift_gate/tests/test_verification_records.py
          drift_gate/tests/test_policy_setup.py
          drift_gate/tests/test_report_naming.py
      - name: Build native app
        run: pyinstaller --noconfirm --clean --windowed --onedir --name DriftGate --collect-all tree_sitter_language_pack --add-data "drift_gate/desktop/web:drift_gate/desktop/web" drift_gate/desktop/web_app.py
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/DriftGate.app DriftGate-macOS.zip
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/DriftGate -DestinationPath DriftGate-Windows.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: DriftGate-macOS
          path: DriftGate-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: DriftGate-Windows
          path: DriftGate-Windows.zip
