name: Benchmark

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run baseline comparison benchmark
        run: |
          drift-gate-eval \
            --compare-baseline \
            --max-fp 0 \
            --max-fn 0 \
            --min-f1 0.95 \
            --out benchmark-${{ github.sha }}.md \
            --html-out benchmark-${{ github.sha }}.html \
            --case-report-dir benchmark-reports-${{ github.sha }}

      - name: Run multi-engine benchmark
        run: |
          drift-gate-eval \
            --engines path-only,patch-aware,semantic-aware \
            --out benchmark-engines-${{ github.sha }}.md \
            --html-out benchmark-engines-${{ github.sha }}.html \
            --case-report-dir benchmark-engine-reports-${{ github.sha }}

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: |
            benchmark-${{ github.sha }}.md
            benchmark-${{ github.sha }}.html
            benchmark-reports-${{ github.sha }}/
            benchmark-engines-${{ github.sha }}.md
            benchmark-engines-${{ github.sha }}.html
            benchmark-engine-reports-${{ github.sha }}/

      - name: Attach benchmark report to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "benchmark-${{ github.sha }}.md" \
            "benchmark-${{ github.sha }}.html" \
            "benchmark-engines-${{ github.sha }}.md" \
            "benchmark-engines-${{ github.sha }}.html" \
            --clobber
