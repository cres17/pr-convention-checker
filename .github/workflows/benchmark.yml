name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  benchmark:
    # Release report upload requires this permission; no untrusted PR trigger.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Run baseline comparison benchmark
        run: |
          drift-gate-eval \
            --compare-baseline \
            --max-fp 0 \
            --max-fn 0 \
            --min-f1 0.95 \
            --out benchmark-${{ github.sha }}.md \
            --html-out benchmark-${{ github.sha }}.html \
            --case-report-dir benchmark-reports-${{ github.sha }}

      - name: Run multi-engine benchmark
        run: |
          drift-gate-eval \
            --engines path-only,patch-aware,semantic-aware \
            --out benchmark-engines-${{ github.sha }}.md \
            --html-out benchmark-engines-${{ github.sha }}.html \
            --case-report-dir benchmark-engine-reports-${{ github.sha }}

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.sha }}
          path: |
            benchmark-${{ github.sha }}.md
            benchmark-${{ github.sha }}.html
            benchmark-reports-${{ github.sha }}/
            benchmark-engines-${{ github.sha }}.md
            benchmark-engines-${{ github.sha }}.html
            benchmark-engine-reports-${{ github.sha }}/

      - name: Attach benchmark report to release
        if: github.event_name == 'release' && !startsWith(github.ref_name, 'desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "benchmark-${{ github.sha }}.md" \
            "benchmark-${{ github.sha }}.html" \
            "benchmark-engines-${{ github.sha }}.md" \
            "benchmark-engines-${{ github.sha }}.html" \
            --clobber
