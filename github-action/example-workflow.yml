# .github/workflows/drift-gate.yml
#
# 이 파일을 레포의 .github/workflows/drift-gate.yml 에 복사하여 사용하세요.
# GitHub Secrets에 ANTHROPIC_API_KEY를 추가해야 합니다.
# 레포 루트에 .drift-gate.yml 정책 파일이 있어야 동작합니다.

name: Drift Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  drift-gate:
    name: Contract Drift Check
    runs-on: ubuntu-latest
    # 포크 PR은 시크릿 접근 불가 — 보안상 스킵
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git diff 폴백 대비 전체 히스토리

      - name: Run Drift Gate
        id: drift
        uses: cres17/pr-convention-checker@v1
        # 로컬 액션 사용 시:
        # uses: ./
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # policy_file: .drift-gate.yml   # 기본값. 경로가 다르면 명시
          # model: claude-opus-4-6         # 기본값
          # fail_on_blocker: "true"        # 기본값
          # post_comment: "true"           # 기본값

      # 선택: Job Summary에 리포트 출력
      - name: Write job summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/drift_gate_report.md" ]; then
            cat "${RUNNER_TEMP}/drift_gate_report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 결과 | BLOCKER | MAJOR | 전체 위반 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|-------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ steps.drift.outputs.result }} | ${{ steps.drift.outputs.blocker_count }} | ${{ steps.drift.outputs.major_count }} | ${{ steps.drift.outputs.violation_count }} |" >> "$GITHUB_STEP_SUMMARY"
