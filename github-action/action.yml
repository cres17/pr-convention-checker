name: Spec/Contract Drift Gate
description: >
  PR 변경분을 분석해 코드 변경이 팀의 계약 문서(spec/runbook/CHANGELOG 등)와
  어긋났는지 자동 점검하고, 누락 문서 발견 시 CI를 실패시키는 정책 집행형 GitHub Action.

inputs:
  anthropic_api_key:
    description: Anthropic API 키 (체크리스트 생성용 Claude 호출)
    required: true
  github_token:
    description: GitHub 토큰 (PR 코멘트 게시용)
    required: true
    default: ${{ github.token }}
  policy_file:
    description: drift gate 정책 파일 경로
    required: false
    default: ".drift-gate.yml"
  model:
    description: 사용할 Claude 모델 ID
    required: false
    default: "claude-opus-4-6"
  post_comment:
    description: PR 코멘트 게시 여부 (true/false)
    required: false
    default: "true"
  fail_on_blocker:
    description: BLOCKER 위반 발견 시 exit 1로 CI 실패 여부
    required: false
    default: "true"

outputs:
  result:
    description: 게이트 결과 (pass / warn / fail / skip)
    value: ${{ steps.check.outputs.result }}
  blocker_count:
    description: BLOCKER 위반 수
    value: ${{ steps.check.outputs.blocker_count }}
  major_count:
    description: MAJOR 위반 수
    value: ${{ steps.check.outputs.major_count }}
  violation_count:
    description: 전체 위반 수
    value: ${{ steps.check.outputs.violation_count }}
  comment_url:
    description: 게시된 PR 코멘트 URL
    value: ${{ steps.post.outputs.comment_url }}

runs:
  using: composite
  steps:
    - name: Drift Gate 평가 실행
      id: check
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MODEL: ${{ inputs.model }}
        POLICY_FILE: ${{ inputs.policy_file }}
      run: ${{ github.action_path }}/entrypoint.sh

    - name: PR 코멘트 게시
      id: post
      if: inputs.post_comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMENT_MARKER: "<!-- drift-gate-v1 -->"
      run: |
        REPORT_FILE="${RUNNER_TEMP}/drift_gate_report.md"
        if [ ! -f "$REPORT_FILE" ]; then
          echo "report file not found, skipping"
          exit 0
        fi

        BODY=$(cat "$REPORT_FILE")

        # 기존 drift-gate 코멘트 찾아 업데이트 (없으면 새로 생성)
        EXISTING_ID=$(gh api \
          "repos/${REPO}/issues/${PR_NUMBER}/comments" \
          --jq ".[] | select(.body | startswith(\"${COMMENT_MARKER}\")) | .id" \
          | head -1)

        if [ -n "$EXISTING_ID" ]; then
          COMMENT_URL=$(gh api \
            -X PATCH \
            "repos/${REPO}/issues/comments/${EXISTING_ID}" \
            -f body="$BODY" \
            --jq ".html_url")
        else
          COMMENT_URL=$(gh api \
            -X POST \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY" \
            --jq ".html_url")
        fi

        echo "comment_url=${COMMENT_URL}" >> "$GITHUB_OUTPUT"

    - name: BLOCKER 발견 시 CI 실패
      if: inputs.fail_on_blocker == 'true' && steps.check.outputs.result == 'fail'
      shell: bash
      run: |
        echo "::error::Drift Gate FAIL — BLOCKER ${{ steps.check.outputs.blocker_count }}개 발견. 계약 문서를 동기화한 후 머지하세요."
        exit 1
