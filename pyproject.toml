[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-gate"
version = "1.0.0"
description = "Spec/Contract Drift Gate - doc-code consistency policy engine"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0,<7", "tree-sitter>=0.26,<0.27", "tree-sitter-language-pack==1.20.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]
desktop = ["PySide6>=6.8,<7"]
oracle = ["fastapi==0.115.12", "pydantic==2.11.5"]

[project.scripts]
drift-gate = "drift_gate.adapters.cli.runner:run_cli"
dg = "drift_gate.adapters.cli.runner:run_cli"
drift-gate-eval = "drift_gate.adapters.eval.runner:run_eval"
drift-gate-mcp = "drift_gate.adapters.mcp.server:main"
drift-gate-desktop = "drift_gate.desktop.web_app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drift_gate*"]

[tool.pytest.ini_options]
testpaths = ["drift_gate/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.package-data]
"drift_gate.adapters" = ["parser_hashes.json"]
"drift_gate.desktop" = ["web/**/*", "web/*"]

"drift_gate.tests" = ["fixtures/*.json", "fixtures/**/*.json", "contracts/*.json"]
