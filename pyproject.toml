[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-gate"
version = "1.0.0"
description = "Spec/Contract Drift Gate - doc-code consistency policy engine"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "tree-sitter-language-pack>=1.8.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pyyaml>=6.0"]

[project.scripts]
drift-gate = "drift_gate.adapters.cli.runner:run_cli"
dg = "drift_gate.adapters.cli.runner:run_cli"
drift-gate-eval = "drift_gate.adapters.eval.runner:run_eval"
drift-gate-mcp = "drift_gate.adapters.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drift_gate*"]

[tool.pytest.ini_options]
testpaths = ["drift_gate/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
