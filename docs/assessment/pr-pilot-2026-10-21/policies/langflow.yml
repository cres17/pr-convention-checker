# PR 파일럿 정책 — langflow-ai/langflow (main). PR을 보기 전에 기본 브랜치 파일 구조만 보고 작성했다. 실행 후 수정하지 않는다.
rules:
  - id: env-sample-content
    when:
      any_changed: ["src/backend/base/langflow/services/settings/**", "src/lfx/src/lfx/services/settings/**"]
      trigger: {family: env-key, predicate: key-added, scope: selected-modules, on_unknown: review}
    require:
      groups:
        - name: Environment sample keys
          all_changed: [".env.example"]
          content: env-keys
    severity: blocker
    message: "새 환경 변수 키를 .env.example에 반영한 뒤 다시 검사하세요."
  - id: api-route-content
    when:
      any_changed: ["src/backend/base/langflow/api/**"]
      trigger: {family: api-route, predicate: route-changed, scope: selected-modules, on_unknown: review}
    require:
      groups:
        - name: API route documentation
          all_changed: ["docs/openapi/openapi.json"]
          content: api-routes
    severity: blocker
    message: "추가·제거한 메서드와 경로를 docs/openapi/openapi.json에 반영한 뒤 다시 검사하세요."
gate:
  fail_on_blocker: true
  fail_on_major_count: 2
  on_unverified: warn
ignore_paths: ["**/__pycache__/**", "**/*.pyc"]
