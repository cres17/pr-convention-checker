# .drift-gate.yml — Spec/Contract Drift Gate 정책 파일
#
# when 조건이 충족되면 규칙 활성화.
# require.groups의 모든 묶음을 만족해야 통과.
# 묶음 하나라도 불충족 → 위반.

rules:

  # ─── API surface 변경 → 계약 문서 + 릴리즈 공지 ─────────────────────────────
  - id: api-contract-sync
    when:
      any_changed:
        - "src/routes/**"
        - "openapi/**"
        - "proto/**"
        - "src/controllers/**"
        - "app/controllers/**"
    require:
      groups:
        - name: "API 계약 문서"
          any_changed:
            - "docs/spec.md"
            - "docs/api/**"
        - name: "릴리즈 공지"
          all_changed:
            - "CHANGELOG.md"
    severity: blocker
    message: "API surface changed without synced contract/docs"

  # ─── DB 스키마 변경 → 운영 문서 + 검증 흔적 ──────────────────────────────────
  - id: schema-migration-proof
    when:
      any_changed:
        - "db/migrations/**"
        - "prisma/schema.prisma"
        - "sql/**"
        - "**/schema.sql"
        - "alembic/versions/**"
    require:
      groups:
        - name: "운영 문서"
          any_changed:
            - "docs/runbook/**"
            - "docs/migration-notes/**"
        - name: "검증 흔적"
          any_changed:
            - "tests/integration/**"
            - "tests/e2e/**"
    severity: major
    message: "DB schema changed without runbook or integration test"

  # ─── env/config 변경 → .env.example + 배포 문서 ──────────────────────────────
  - id: env-config-sync
    when:
      any_changed:
        - ".env"
        - ".env.*"
        - ".env.local"
        - ".env.production"
        - ".env.staging"
        - "config/**"
        - "src/config/**"
        - "**/settings.py"
    require:
      groups:
        - name: "샘플 환경변수"
          all_changed:
            - ".env.example"
        - name: "배포 문서"
          any_changed:
            - "docs/deployment/**"
            - "docs/runbook/**"
    severity: major
    message: "env/config changed without .env.example or deployment docs update"

  # ─── CI/인프라 변경 → 운영 문서 ──────────────────────────────────────────────
  - id: workflow-ops-doc
    when:
      any_changed:
        - ".github/workflows/**"
        - "infra/**"
        - "terraform/**"
        - "Dockerfile"
        - "Dockerfile.*"
        - "k8s/**"
        - "helm/**"
    require:
      groups:
        - name: "운영 문서"
          any_changed:
            - "docs/ops/**"
            - "docs/runbook/**"
    severity: minor
    message: "CI/infra changed without ops documentation update"

  # ─── auth/권한 변경 → 보안 문서 ───────────────────────────────────────────────
  - id: auth-security-doc
    when:
      any_changed:
        - "**/auth/**"
        - "**/middleware/auth*"
        - "**/rbac/**"
        - "**/permissions/**"
    require:
      groups:
        - name: "보안/권한 문서"
          any_changed:
            - "docs/security/**"
            - "docs/auth/**"
            - "docs/runbook/**"
    severity: major
    message: "Auth/permission changed without security documentation update"

# ─── CI 게이트 기준 ────────────────────────────────────────────────────────────
gate:
  fail_on_blocker: true      # BLOCKER ≥ 1 → CI fail
  fail_on_major_count: 2     # MAJOR ≥ 2  → CI fail  (1개는 warn)

# ─── drift 평가 제외 경로 ─────────────────────────────────────────────────────
# 주의: ignore_paths는 트리거(when)와 충족(require) 양쪽 모두에서 제외.
# docs/**, tests/** 등 require.groups에서 사용하는 경로는 여기에 넣지 않는다.
ignore_paths:
  - "src/internal/**"     # 외부 계약에 영향 없는 내부 구현
  - "scripts/dev/**"      # 개발 편의 스크립트
